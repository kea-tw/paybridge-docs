# Сборка и публикация сайта на GitHub Pages при каждом изменении ветки main.
name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLANTUML_VERSION: 1.2024.8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # Диаграммы рисует PlantUML прямо в сборке, без внешнего сервера.
      # Java на раннере уже есть, Graphviz нужен для схем компонентов и состояний.
      - name: Install PlantUML
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q graphviz
          curl -sSL -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar
      - name: Render diagrams
        run: |
          java -Djava.awt.headless=true -jar plantuml.jar -tsvg -o ../out \
            admin/docs/diagrams/src/*.puml integration/docs/diagrams/src/*.puml

      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: https://github.com/${{ github.repository }}
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
